# 生产环境 nginx 配置：在容器内终止 TLS，HTTP 80 跳转 HTTPS 443
# 证书由 docker-compose.prod.yml 挂载到 /certs（fullchain.pem + privkey.pem）
server {
    listen 80;
    server_name _;
    # 生产建议把 HTTP 跳转 HTTPS；若想同时保留 HTTP 直连，把下面一行换成正常服务：
    #   root /usr/share/nginx/html; index index.html; try_files $uri $uri/ =404;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：确认全站长期 HTTPS 后再取消注释启用
    # add_header Strict-Transport-Security "max-age=63072000" always;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|json|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
