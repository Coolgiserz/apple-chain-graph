<script>
(function () {
  "use strict";
  var REGION_ZH = { "East Asia": "东亚", "North America": "北美", "Europe": "欧洲" };
  var data = (window.SUPPLIERS || []).map(function (s) {
    var o = {};
    for (var k in s) { o[k] = s[k]; }
    o.region_zh = REGION_ZH[s.region] || s.region;
    return o;
  });

  var q = document.getElementById("q"),
      fR = document.getElementById("fRegion"),
      fC = document.getElementById("fCountry"),
      fCat = document.getElementById("fCategory"),
      fT = document.getElementById("fTier"),
      tbody = document.getElementById("tbody"),
      count = document.getElementById("count"),
      total = document.getElementById("total");

  total.textContent = data.length;

  function uniq(arr) { return Array.from(new Set(arr)); }
  function fill(sel, vals) {
    vals.slice().sort(function (a, b) { return String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0); })
        .forEach(function (v) { var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  }
  fill(fR, uniq(data.map(function (s) { return s.region; })));
  fill(fC, uniq(data.map(function (s) { return s.country; })));
  fill(fCat, uniq(data.map(function (s) { return s.category; })));
  fill(fT, uniq(data.map(function (s) { return s.tier; })));

  var sortKey = null, sortDir = 1;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    var kw = q.value.trim().toLowerCase();
    var rows = data.filter(function (s) {
      if (fR.value && s.region !== fR.value) return false;
      if (fC.value && s.country !== fC.value) return false;
      if (fCat.value && s.category !== fCat.value) return false;
      if (fT.value && String(s.tier) !== fT.value) return false;
      if (kw) {
        var hay = [s.name, s.short_name, s.english_name, s.id, s.country, s.category].join(" ").toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });

    if (sortKey) {
      rows.sort(function (a, b) {
        var va = a[sortKey], vb = b[sortKey];
        if (sortKey === "tier") { va = +va; vb = +vb; }
        if (va == null) va = ""; if (vb == null) vb = "";
        if (va < vb) return -1 * sortDir;
        if (va > vb) return 1 * sortDir;
        return 0;
      });
    }

    document.querySelectorAll("#tbl thead th[data-k]").forEach(function (th) {
      var ar = th.querySelector(".ar");
      ar.textContent = (th.dataset.k === sortKey) ? (sortDir > 0 ? "▲" : "▼") : "";
    });

    if (!rows.length) {
      tbody.innerHTML = '<tr><td class="empty" colspan="8">没有符合条件的企业，请放宽筛选条件。</td></tr>';
    } else {
      tbody.innerHTML = rows.map(function (s) {
        var tierCls = s.tier === 1 ? "tier1" : (s.tier === 2 ? "tier2" : "");
        return "<tr>"
          + '<td class="name"><a href="../index.html?focus=S:' + esc(s.id) + '">' + esc(s.name) + "</a></td>"
          + "<td>" + esc(s.short_name) + "</td>"
          + "<td>" + esc(s.english_name) + "</td>"
          + "<td>" + esc(s.country) + "</td>"
          + '<td><span class="pill">' + esc(s.region_zh) + "</span></td>"
          + "<td>" + esc(s.category) + "</td>"
          + '<td><span class="pill ' + tierCls + '">T' + esc(s.tier) + "</span></td>"
          + '<td class="acts"><a class="lk" href="../index.html?focus=S:' + esc(s.id) + '">图谱</a>'
          + '<a class="lk" href="../tools/visualizations/supplier_geo.html?supplier=' + esc(s.id) + '">地图</a></td>'
          + "</tr>";
      }).join("");
    }
    count.textContent = "显示 " + rows.length + " / " + data.length + " 家";
  }

  [q, fR, fC, fCat, fT].forEach(function (el) {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });
  document.getElementById("reset").addEventListener("click", function () {
    q.value = ""; fR.value = ""; fC.value = ""; fCat.value = ""; fT.value = ""; sortKey = null; sortDir = 1; render();
  });
  document.querySelectorAll("#tbl thead th[data-k]").forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.dataset.k;
      if (sortKey === k) { sortDir = -sortDir; } else { sortKey = k; sortDir = 1; }
      render();
    });
  });

  render();
})();
</script>
