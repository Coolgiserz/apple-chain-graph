server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 中文内容统一 UTF-8，避免乱码
    charset utf-8;
    server_tokens off;

    # 启用 gzip，减小静态资源传输体积
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # 普通请求：命中文件则返回，否则 404（本项目为纯静态，无后端路由）
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源长缓存（构建产物带稳定文件名）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|json|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
