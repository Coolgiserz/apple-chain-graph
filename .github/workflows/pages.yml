name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR 校验门禁：任何向 main 的合并请求都会先完整跑一遍流水线（构建+lint+测试+数据校验），
  # 但 PR 事件下不会触发部署（见下方 deploy 任务的 if 条件）。这样「合入 main」与「push 到 main」
  # 走的是同一套校验，配合分支保护规则即可在合并前拦截坏代码。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 部署 GitHub Pages 所必需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发覆盖。
# 注意：concurrency group 是「仓库级别作用域」—— 同名 group 只在本仓库内互斥，
# 不会干扰你其它仓库的 Actions。若将来在本仓库内新增第二个 Pages workflow，
# 请给它不同的 group（如 pages-docs），否则两个 workflow 会互相取消。
#
# group 按事件类型拆分，关键约束：
#   - push 到 main 一律归入 `…-main-deploy` 组，部署路径独占该组、绝不会被 PR 校验打断；
#   - 每个 PR 归入独立的 `…-pr-<编号>` 组，仅同一 PR 的重复 push 之间互相取消，
#     互不干扰其它 PR，也绝不会取消正在进行的 main 部署。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main-deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史 + 全部 tag：scripts/version.py 的 git describe 需要距最近 tag 的
          # commit 距离与 sha 才能派生构建版本戳（否则退化为 unknown）。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compute build version
        # 流派 B：根据 git describe 派生构建版本戳（最近 tag + commit 距离 + sha），
        # 写入 GITHUB_ENV 供后续 build_all.py -> build_feeds.py（feeds 信封 meta.build）
        # 与 Write build manifest 步骤（部署清单 _site/build.json）使用。
        run: echo "BUILD_VERSION=$(python scripts/version.py)" >> "$GITHUB_ENV"

      - name: Frontend build, lint & test
        # 前端由 esbuild 打包（src/ -> dist/*.js）；先构建再做 lint + 引擎契约测试。
        run: |
          npm ci
          npm run build
          npm run lint
          node tests/engine.test.mjs

      - name: Build all static pages
        # 前端产物已在上方「Frontend build」步骤生成，跳过 build_all.py 内的重复 Node 构建。
        env:
          SKIP_NODE_BUILD: "1"
        # 可选 —— 访问统计：若要在 GitHub Pages 上启用你自己的 Umami / GoatCounter，
        # 先在仓库 Settings → Secrets 添加 ANALYTICS_WEBSITE_ID（等），再取消下面
        # env: 注释，把配置注入构建环境（build_all.py 与 topnav.py 会读取这些变量；
        # 注意：CI 中无法读取仓库根目录的 .env，必须走这里的环境变量注入）。
        # env:
        #   ANALYTICS_PROVIDER: umami
        #   ANALYTICS_WEBSITE_ID: ${{ secrets.ANALYTICS_WEBSITE_ID }}
        #   ANALYTICS_UMAMI_SRC: https://cloud.umami.is/script.js
        #   ANALYTICS_CODE: ${{ secrets.ANALYTICS_CODE }}
        run: python build_all.py

      - name: Validate supply-chain dataset
        # 数据集内部一致性门禁（引用完整性 / 孤立节点 / 必填字段 / 取值合规）。
        # 阻断式：发现问题即让构建失败，避免把错误关系带上线。
        run: python tools/validate_dataset.py

      - name: Assemble site
        run: |
          # 必须先把目标父目录建好：cp -r src _site/tools/visualizations 在 _site/tools
          # 不存在时会报 "cannot create directory"（cp 不会自动创建多级目标父目录）。
          # 注意：data/ 也必须先建好，否则下方 cp data/*.json / cp -r data/feeds 会因
          # 目标父目录缺失而静默失败（曾被 2>/dev/null || true 吞掉，导致线上 404、
          # 首页 fetch 图数据失败）。
          mkdir -p _site _site/tools _site/docs _site/data
          cp index.html _site/
          cp -r dist _site/
          cp -r tools/visualizations _site/tools/visualizations
          cp -r docs _site/docs 2>/dev/null || true
          # locales/ 一并发布：翻译包虽已内联进 dist/locales.js，但保留根目录副本
          # 作为兜底，避免任何直接引用 /locales/*.json 的路径在未来产生 404。
          cp -r locales _site/locales 2>/dev/null || true
          # 时效数据 feed：DataLayer 在运行时 fetch data/feeds/*.json（风险/估值/舆情），
          # 必须随站点发布；否则首页新鲜度徽标会 404（回退到空）。schemas/ 仅作文档与 CI 校验用。
          cp -r data/feeds _site/data/feeds 2>/dev/null || true
          # Plan C：首页改为浏览器端 fetch 图数据，故 data/apple_supply_chain.json 必须随站点发布
          # （旧方案是构建期内联进 index.html，无需单独发布）。缺失则首页直接白屏，故不让其静默失败。
          cp data/apple_supply_chain.json _site/data/
          # data/supply_chain_risk.json 为构建期从 tools/output 复制的风险副本，供首页合并「风险视图」
          # 字段；缺失仅降级（风险视图字段为空），故允许静默跳过。
          cp data/supply_chain_risk.json _site/data/ 2>/dev/null || true
          # SEO 基础设施：sitemap / robots / OG 封面（构建期生成；首页内联的 og:image 指向 assets/og-cover.png）。
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
          cp -r assets _site/assets 2>/dev/null || true
          cp README.md LICENSE CONTRIBUTING.md _site/ 2>/dev/null || true
          # 禁用 Jekyll：本项目无 _config.yml，但避免 _ 前缀目录被忽略、并加速构建
          touch _site/.nojekyll
          # 可选 —— 供应商地图页依赖腾讯地图签名代理（serviceHost 默认指向本地 127.0.0.1，
          # 纯静态 Pages 上没有该后端，地图不会渲染）。若你自建了公开签名代理，并已配置
          # 仓库 Secrets（TMAP_PROXY_HOST / TMAP_SECRET），可在此替换占位符：
          #   sed -i "s#http://127.0.0.1:__WB_HTTP_PORT__#${TMAP_PROXY_HOST}#g" \
          #     _site/tools/visualizations/supplier_geo.html \
          #     _site/tools/visualizations/supplier_combined.html
          #   sed -i "s#__WB_TMAP_SECRET__#${TMAP_SECRET}#g" \
          #     _site/tools/visualizations/supplier_geo.html \
          #     _site/tools/visualizations/supplier_combined.html
          # 否则地图页在 Pages 上不渲染，其余页面不受影响。

      - name: Write build manifest
        # 部署清单：构建版本（git describe）+ 短 sha + UTC 时间，前端可 fetch /build.json
        # 显示「本站构建于 X / 提交 abc」。BUILD_VERSION 由上方 Compute 步骤写入环境。
        run: |
          python - <<'PY'
          import json, subprocess
          version = "${{ env.BUILD_VERSION }}"
          try:
              sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode().strip()
          except Exception:
              sha = ""
          try:
              when = subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]).decode().strip()
          except Exception:
              when = ""
          manifest = {"build_version": version, "git_sha": sha, "build_at": when}
          with open("_site/build.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print("wrote _site/build.json:", manifest)
          PY

      - name: Python lint & tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -p "test_*.py"
        # flake8 作为渐进式风格门禁：先不阻断部署，待存量代码清理后改为 blocking。
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # 仅当事件为「push 到 main」时才部署。PR 事件下 build 阶段照常校验，但跳过部署，
    # 避免把未合并的草稿代码发布到 GitHub Pages。合并进 main 产生的 push 事件会走到这里，
    # 因此「合入 main」必然再次经过完整流水线（校验通过后才部署）。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
