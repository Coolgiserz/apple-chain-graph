<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>苹果供应商名单：60 家企业供应品类与覆盖产品</title>
<style>
  :root {
  --bg: #0c1020; --card: #131a2e; --soft: #1b2340; --line: #2a3450; --line-soft: #1c2336;
  --ink: #e8ecf4; --ink-soft: #cfe0ff; --muted: #9fb0d0; --muted-dim: #7c8aa8;
  --bright: #ffffff; --link: #dbeafe; --ink-inverse: #111111;
  --control: #33406a; --control-hover: #3a4a6e; --control-border: #3f4f7a;
  --blue: #6ea0ff; --primary: #2f6fed; --primary-hover: #3b82f6; --focus: #5b8cff;
  --brand: #0a2540; --brand-2: #0a66c2;
  --violet: #8b5cf6; --pink: #ec4899; --cyan: #22d3ee;
  --green: #4ade80; --success-ink: #bbf7d0; --success-bg: #163a2a;
  --red: #f87171; --danger-ink: #ffb4b4; --danger-bg: #3b1520; --danger-line: #7f1d1d;
  --amber: #fbbf24; --warn: #f59e0b; --warn-ink: #fde68a; --warn-bg: #3a2e16; --warn-line: #7a5c14;
  --fs-xs: 11px; --fs-sm: 12px; --fs-base: 13px; --fs-md: 14px;
  --fs-lg: 16px; --fs-xl: 18px; --fs-display: 24px;
}
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
  body { padding-top: calc(52px + env(safe-area-inset-top)); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  main { padding: 16px 18px 48px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: var(--fs-xl); margin: 6px 0 4px; }
  .desc { color: var(--muted); font-size: var(--fs-base); margin-bottom: 14px; }
  .desc b { color: var(--ink-soft); }
  #top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(20,26,42,.7);
         border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  #top .grp { display: flex; align-items: center; gap: 6px; }
  #top label { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
  #top input[type=search], #top select { background: var(--bg); border: 1px solid var(--line); color: var(--ink);
         border-radius: 8px; padding: 6px 10px; outline: none; font-size: var(--fs-base); }
  #top input[type=search] { width: 240px; }
  #top button { background: var(--primary); color: var(--bright); border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: var(--fs-base); }
  #top button.ghost { background: var(--line); }
  /* 键盘焦点可见（WCAG 2.4.7）：覆盖 outline:none 的控件与可排序表头 */
  #top input:focus-visible, #top select:focus-visible, #top button:focus-visible,
  #tbl thead th:focus-visible, a:focus-visible, button:focus-visible,
  input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  #count { color: var(--muted); font-size: var(--fs-base); margin-left: auto; white-space: nowrap; }
  .wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: calc(100vh - 200px); }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs-base); min-width: 880px; }
  thead th { position: sticky; top: 0; background: var(--card); color: var(--ink-soft); text-align: left; padding: 11px 12px;
             cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--line); }
  thead th:hover { background: var(--control-hover); }
  thead th .ar { color: var(--blue); font-size: var(--fs-xs); margin-left: 4px; }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--card); white-space: nowrap; }
  tbody tr:hover { background: rgba(47,111,237,.10); }
  td.name a { color: var(--blue); text-decoration: none; font-weight: 600; }
  td.name a:hover { text-decoration: underline; }
  .pill { display: inline-block; font-size: var(--fs-xs); padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--ink-soft); }
  .tier1 { background: var(--success-bg); color: var(--green); }
  .tier2 { background: var(--warn-bg); color: var(--warn-ink); }
  .acts a { margin-right: 10px; font-size: var(--fs-sm); }
  a { color: var(--blue); }
  .lk { color: var(--blue); text-decoration: none; border-bottom: 1px dashed var(--blue); cursor: pointer; }
  .lk:hover { background: rgba(110,160,255,.15); }
  .empty { padding: 28px; text-align: center; color: var(--muted-dim); }
  /* 移动端适配：搜索框全宽、缩小内边距；表格横向滚动交由 .wrap 处理 */
  @media (max-width: 860px) {
    main { padding: 12px; }
    #top { gap: 8px; padding: 10px; }
    #top input[type=search] { width: 100%; flex: 1 1 100%; }
    #top .grp { flex: 1 1 auto; }
    #top label { font-size: var(--fs-sm); }
  }
  /* 前庭友好：系统开启「减少动态效果」时压缩过渡时长（WCAG 2.3.3） */
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
__TOPNAV_CSS__
</style>
</head>
<body>
__TOPNAV__
<main>
  <h1>📋 供应链企业列表</h1>
  <div class="desc">图谱中共有 <b id="total">0</b> 家企业（供应商节点）。可按地区 / 国家 / 类别 / 层级筛选，点击或用键盘（Tab 聚焦后回车）排序列标题；点名称可在图谱中定位该企业。</div>
  <div id="top">
    <div class="grp"><input type="search" id="q" aria-label="搜索企业名称、简称、英文名或 ID" placeholder="搜索 名称 / 简称 / 英文名 / ID…"></div>
    <div class="grp"><label for="fRegion">地区</label><select id="fRegion"><option value="">全部</option></select></div>
    <div class="grp"><label for="fCountry">国家/地区</label><select id="fCountry"><option value="">全部</option></select></div>
    <div class="grp"><label for="fCategory">类别</label><select id="fCategory"><option value="">全部</option></select></div>
    <div class="grp"><label for="fTier">层级</label><select id="fTier"><option value="">全部</option></select></div>
    <button id="reset" class="ghost">重置筛选</button>
    <span id="count"></span>
  </div>
  <div class="wrap">
    <table id="tbl">
      <thead><tr>
        <th data-k="name" scope="col" tabindex="0" aria-sort="none">名称 <span class="ar"></span></th>
        <th data-k="short_name" scope="col" tabindex="0" aria-sort="none">简称 <span class="ar"></span></th>
        <th data-k="english_name" scope="col" tabindex="0" aria-sort="none">英文名 <span class="ar"></span></th>
        <th data-k="country" scope="col" tabindex="0" aria-sort="none">国家/地区 <span class="ar"></span></th>
        <th data-k="region" scope="col" tabindex="0" aria-sort="none">地区 <span class="ar"></span></th>
        <th data-k="category" scope="col" tabindex="0" aria-sort="none">类别 <span class="ar"></span></th>
        <th data-k="tier" scope="col" tabindex="0" aria-sort="none">层级 <span class="ar"></span></th>
        <th scope="col">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<script>window.SUPPLIERS = __DATA__;</script>
<script>
(function () {
  "use strict";
  var REGION_ZH = { "East Asia": "东亚", "North America": "北美", "Europe": "欧洲" };
  var data = (window.SUPPLIERS || []).map(function (s) {
    var o = {};
    for (var k in s) { o[k] = s[k]; }
    o.region_zh = REGION_ZH[s.region] || s.region;
    return o;
  });

  var q = document.getElementById("q"),
      fR = document.getElementById("fRegion"),
      fC = document.getElementById("fCountry"),
      fCat = document.getElementById("fCategory"),
      fT = document.getElementById("fTier"),
      tbody = document.getElementById("tbody"),
      count = document.getElementById("count"),
      total = document.getElementById("total");

  total.textContent = data.length;

  function uniq(arr) { return Array.from(new Set(arr)); }
  function fill(sel, vals) {
    vals.slice().sort(function (a, b) { return String(a) < String(b) ? -1 : (String(a) > String(b) ? 1 : 0); })
        .forEach(function (v) { var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  }
  fill(fR, uniq(data.map(function (s) { return s.region; })));
  fill(fC, uniq(data.map(function (s) { return s.country; })));
  fill(fCat, uniq(data.map(function (s) { return s.category; })));
  fill(fT, uniq(data.map(function (s) { return s.tier; })));

  var sortKey = null, sortDir = 1;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    var kw = q.value.trim().toLowerCase();
    var rows = data.filter(function (s) {
      if (fR.value && s.region !== fR.value) return false;
      if (fC.value && s.country !== fC.value) return false;
      if (fCat.value && s.category !== fCat.value) return false;
      if (fT.value && String(s.tier) !== fT.value) return false;
      if (kw) {
        var hay = [s.name, s.short_name, s.english_name, s.id, s.country, s.category].join(" ").toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });

    if (sortKey) {
      rows.sort(function (a, b) {
        var va = a[sortKey], vb = b[sortKey];
        if (sortKey === "tier") { va = +va; vb = +vb; }
        if (va == null) va = ""; if (vb == null) vb = "";
        if (va < vb) return -1 * sortDir;
        if (va > vb) return 1 * sortDir;
        return 0;
      });
    }

    document.querySelectorAll("#tbl thead th[data-k]").forEach(function (th) {
      var ar = th.querySelector(".ar");
      ar.textContent = (th.dataset.k === sortKey) ? (sortDir > 0 ? "▲" : "▼") : "";
      // aria-sort 同步，屏幕阅读器可感知当前排序列与方向
      th.setAttribute("aria-sort",
        th.dataset.k === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none");
    });

    if (!rows.length) {
      tbody.innerHTML = '<tr><td class="empty" colspan="8">没有符合条件的企业，请放宽筛选条件。</td></tr>';
    } else {
      tbody.innerHTML = rows.map(function (s) {
        var tierCls = s.tier === 1 ? "tier1" : (s.tier === 2 ? "tier2" : "");
        return "<tr>"
          + '<td class="name"><a href="../index.html?focus=S:' + esc(s.id) + '">' + esc(s.name) + "</a></td>"
          + "<td>" + esc(s.short_name) + "</td>"
          + "<td>" + esc(s.english_name) + "</td>"
          + "<td>" + esc(s.country) + "</td>"
          + '<td><span class="pill">' + esc(s.region_zh) + "</span></td>"
          + "<td>" + esc(s.category) + "</td>"
          + '<td><span class="pill ' + tierCls + '">T' + esc(s.tier) + "</span></td>"
          + '<td class="acts"><a class="lk" href="../index.html?focus=S:' + esc(s.id) + '">图谱</a>'
          + '<a class="lk" href="../tools/visualizations/supplier_geo.html?supplier=' + esc(s.id) + '">地图</a></td>'
          + "</tr>";
      }).join("");
    }
    count.textContent = "显示 " + rows.length + " / " + data.length + " 家";
  }

  [q, fR, fC, fCat, fT].forEach(function (el) {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });
  document.getElementById("reset").addEventListener("click", function () {
    q.value = ""; fR.value = ""; fC.value = ""; fCat.value = ""; fT.value = ""; sortKey = null; sortDir = 1; render();
  });
  document.querySelectorAll("#tbl thead th[data-k]").forEach(function (th) {
    var activate = function () {
      var k = th.dataset.k;
      if (sortKey === k) { sortDir = -sortDir; } else { sortKey = k; sortDir = 1; }
      render();
    };
    th.addEventListener("click", activate);
    // 键盘可达排序（WCAG 2.1.1）：Enter / 空格 与鼠标点击等效
    th.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
    });
  });

  render();
})();
</script>
</body>
</html>
