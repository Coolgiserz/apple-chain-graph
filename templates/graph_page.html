<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>苹果供应链上下游图谱</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1320; color: #e8ecf4; overflow: hidden; }
  /* canvas 是替换元素：仅靠 top/bottom/left/right 不会拉伸，必须用显式 width/height
     否则回退到固有 300x150，导致图谱只画在左上角一小块（"看不到图谱"）。 */
  #cv { position: absolute; top: 52px; left: 0; width: 100%; height: calc(100% - 52px); display: block; cursor: grab; }
  #cv.dragging { cursor: grabbing; }
  #top { position: absolute; top: 64px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
         background: rgba(20,26,42,.85); border: 1px solid #2a3450; border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(8px); z-index: 10;
         pointer-events: none; }   /* 容器本身不拦截鼠标，避免遮挡画布上位于该区域的节点 */
  #top input, #top select, #top button, #top .chk { pointer-events: auto; }   /* 仅表单控件可点击 */
  #top .grp { display: flex; align-items: center; gap: 6px; }
  #top label { font-size: 12px; color: #9fb0d0; }
  #top input[type=search] { background: #0c1020; border: 1px solid #2a3450; color: #e8ecf4; border-radius: 8px; padding: 6px 10px; width: 200px; outline: none; }
  #top select { background: #0c1020; border: 1px solid #2a3450; color: #e8ecf4; border-radius: 8px; padding: 6px 8px; outline: none; }
  #top .chk { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; user-select: none; }
  #top button { background: #2f6fed; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  #top button.ghost { background: #2a3450; }
  #top a.tlink { background: #2a3450; color: #dbeafe; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 8px; white-space: nowrap; transition: background .15s; }
  #top a.tlink:hover { background: #3a4a6e; color: #fff; }
  #top .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #7c8aa8; background: rgba(20,26,42,.7); padding: 6px 10px; border-radius: 8px; z-index: 10; pointer-events: none; }
  #panel { position: absolute; top: 122px; right: 12px; width: 320px; max-height: calc(100% - 134px); overflow: auto;
           background: rgba(20,26,42,.95); border: 1px solid #2a3450; border-radius: 12px; padding: 16px; z-index: 9; display: none; }
  #panel h3 { margin: 0 0 4px; font-size: 16px; }
  #panel .sub { font-size: 12px; color: #9fb0d0; margin-bottom: 10px; }
  #panel .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin: 0 6px 8px 0; }
  #panel dl { margin: 0; font-size: 13px; }
  #panel dt { color: #9fb0d0; font-size: 11px; margin-top: 8px; }
  #panel dd { margin: 2px 0 0; line-height: 1.5; }
  #panel .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #9fb0d0; font-size: 18px; }
  #panel ul { margin: 4px 0 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  /* 关联邻居可点击：指向 + 悬停高亮，提示可聚焦 */
  #panel li.rel { cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: background .12s, color .12s; }
  #panel li.rel:hover { background: #1b2742; color: #cfe0ff; }
  a { color: #6ea0ff; }
  .lk { color: #6ea0ff; text-decoration: none; border-bottom: 1px dashed #6ea0ff; cursor: pointer; }
  .lk:hover { background: rgba(110,160,255,.15); }
  /* —— 侧边企业表格面板（与图谱联动，不遮挡图谱）—————————————————————— */
  #side { position: absolute; top: 116px; left: 0; width: 384px; bottom: 12px;
          background: rgba(18,24,40,.97); border-right: 1px solid #2a3450;
          display: none; flex-direction: column; z-index: 8; box-shadow: 4px 0 16px rgba(0,0,0,.25); }
  #side header { display: flex; align-items: center; justify-content: space-between;
                 padding: 12px 14px; border-bottom: 1px solid #2a3450; }
  #side header h2 { margin: 0; font-size: 14px; color: #e8ecf4; font-weight: 600; }
  #side header .cnt { color: #9fb0d0; font-weight: 400; }
  #side header .close { cursor: pointer; color: #9fb0d0; font-size: 20px; line-height: 1; padding: 0 4px; }
  #side header .close:hover { color: #fff; }
  #side .scroll { overflow: auto; flex: 1; }
  #side table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #side th, #side td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1c2336; }
  #side th { position: sticky; top: 0; background: #161c2e; color: #9fb0d0; font-weight: 600; font-size: 11px; }
  #side tbody tr { cursor: pointer; }
  #side tbody tr:hover { background: rgba(47,111,237,.16); }
  #side tbody tr.active { background: rgba(47,111,237,.32); }
  #side td.name { color: #e8ecf4; max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #side td.tier { color: #cfe0ff; }
  #side td.empty { text-align: center; color: #7c8aa8; padding: 24px; }
  /* 面板打开时，画布让出左侧空间（图谱不被遮挡，仅压缩显示区域） */
  body.table-open #cv { left: 384px; width: calc(100% - 384px); }
  body.table-open #hint { display: none; }
__TOPNAV_CSS__
</style>
</head>
<body>
__TOPNAV__
<canvas id="cv"></canvas>
<div id="top">
  <div class="grp"><input type="search" id="q" placeholder="搜索产品/零部件/供应商…"></div>
  <div class="grp">
    <label class="chk"><input type="checkbox" id="cbP" checked><span class="dot" style="background:#2f6fed"></span>产品</label>
    <label class="chk"><input type="checkbox" id="cbC" checked><span class="dot" style="background:#f59e0b"></span>零部件</label>
    <label class="chk"><input type="checkbox" id="cbS" checked><span class="dot" style="background:#10b981"></span>供应商</label>
  </div>
  <div class="grp"><label>产品线</label>
    <select id="line"><option value="">全部</option></select>
  </div>
  <button id="toggleTable" class="ghost">📋 企业表格</button>
  <button id="reset" class="ghost">重置视图</button>
</div>
<div id="panel"><span class="close" id="pc">×</span><div id="pbody"></div></div>
<div id="hint">滚轮缩放 · 拖拽画布平移 · 拖动节点 · 单击节点看详情</div>
<div id="side" style="display:none">
  <header>
    <h2>企业表格 <span class="cnt">(<span id="sideCount">0</span>)</span></h2>
    <span class="close" id="sideClose" title="关闭">×</span>
  </header>
  <div class="scroll">
    <table>
      <thead><tr><th>名称</th><th>国家/地区</th><th>类别</th><th>层级</th></tr></thead>
      <tbody id="sideBody"></tbody>
    </table>
  </div>
</div>
<script>window.SUPPLY_DATA = __DATA__;</script>
<script src="__ENGINE_SRC__"></script>
<script src="__BOOTSTRAP_SRC__"></script>
<script src="__TABLE_PANEL_SRC__"></script>
</body>
</html>
